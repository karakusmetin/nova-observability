services:

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: nova-observability-lgtm

    ports:
      # Grafana UI
      - "3000:3000"

      # OTLP gRPC
      - "4317:4317"

      # OTLP HTTP/protobuf
      - "4318:4318"

    volumes:
      - nova-lgtm-data:/data

    restart: unless-stopped

volumes:
  nova-lgtm-data: